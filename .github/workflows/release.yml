name: Publish Soro X release

# Publishes the installers from the latest successful "Soro X desktop apps",
# "Soro X Tablet apps" and "Soro X Mobile apps" runs on this branch as a GitHub Release, under stable
# file names. The download page (site/) links to
#   https://github.com/<repo>/releases/latest/download/<file>
# so it always serves the newest release without being redeployed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Leave empty: it becomes v<desktop build version>, which installed apps compare against for updates.'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest successful builds
        id: runs
        run: |
          set -euo pipefail
          latest() {
            gh run list --workflow "$1" --branch "$BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty'
          }
          DESKTOP=$(latest desktop-apps.yml)
          TABLET=$(latest tablet-apps.yml)
          MOBILE=$(latest mobile-apps.yml)
          # Publish what is ready; a later run adds the rest.
          [ -n "$DESKTOP" ] || echo "::warning::No successful 'Soro X desktop apps' run on $BRANCH yet: no Windows/Mac files in this release."
          [ -n "$TABLET" ] || echo "::warning::No successful 'Soro X Tablet apps' run on $BRANCH yet: no tablet files in this release."
          [ -n "$MOBILE" ] || echo "::warning::No successful 'Soro X Mobile apps' run on $BRANCH yet: no phone files in this release."
          if [ -z "$DESKTOP$TABLET$MOBILE" ]; then echo "::error::Nothing to publish yet."; exit 1; fi
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "tablet=$TABLET" >> "$GITHUB_OUTPUT"
          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "Desktop run $DESKTOP, tablet run $TABLET, mobile run $MOBILE"

      - name: Download and rename
        run: |
          set -euo pipefail
          mkdir -p dl out
          [ -z "${{ steps.runs.outputs.desktop }}" ] || gh run download "${{ steps.runs.outputs.desktop }}" --dir dl/desktop
          [ -z "${{ steps.runs.outputs.tablet }}" ] || gh run download "${{ steps.runs.outputs.tablet }}" --dir dl/tablet
          [ -z "${{ steps.runs.outputs.mobile }}" ] || gh run download "${{ steps.runs.outputs.mobile }}" --dir dl/mobile
          find dl -type f | sort
          one() { # copy the first match under its stable name; warn when missing
            local found; found=$(find "${3:-dl}" -type f -iname "$1" 2>/dev/null | head -n1)
            if [ -z "$found" ]; then echo "::warning::No file matching $1"; return 0; fi
            cp "$found" "out/$2"
          }
          one '*Setup*.exe'          SoroX-Windows-Setup.exe
          PORTABLE=$(find dl -path '*desktop*' -type f -iname '*.exe' ! -iname '*Setup*' | head -n1)
          [ -n "$PORTABLE" ] && cp "$PORTABLE" out/SoroX-Windows-Portable.exe || echo "::warning::No portable .exe found"
          one '*arm64*.dmg'          SoroX-macOS-AppleSilicon.dmg
          one '*x64*.dmg'            SoroX-macOS-Intel.dmg
          one '*.apk'                SoroX-Tablet-Android.apk        dl/tablet
          one '*.ipa'                SoroX-Tablet-iPad-unsigned.ipa  dl/tablet
          one '*.apk'                SoroX-Android.apk               dl/mobile
          one '*.ipa'                SoroX-iPhone-unsigned.ipa       dl/mobile
          # Update feeds for the desktop app's built-in update check (electron-updater):
          # latest.yml points at the stable installer name used in this release.
          WIN_FEED=$(find dl/desktop -type f -name 'latest.yml' 2>/dev/null | head -n1 || true)
          if [ -n "$WIN_FEED" ]; then
            sed -E 's#^(\s*-?\s*url: ).*Setup.*\.exe\s*$#\1SoroX-Windows-Setup.exe#; s#^(path: ).*Setup.*\.exe\s*$#\1SoroX-Windows-Setup.exe#' "$WIN_FEED" > out/latest.yml
            cat out/latest.yml
          else echo "::warning::No latest.yml: installed Windows copies will not see this release as an update"; fi
          MAC_FEED=$(find dl/desktop -type f -name 'latest-mac.yml' 2>/dev/null | head -n1 || true)
          [ -n "$MAC_FEED" ] && cp "$MAC_FEED" out/latest-mac.yml || echo "::warning::No latest-mac.yml"
          ls -la out
          [ -n "$(ls -A out)" ] || { echo "::error::No files to publish."; exit 1; }

      - name: Publish release
        run: |
          set -euo pipefail
          # The desktop build's own version (2.9.<100 + build>), so the tag is what
          # installed copies compare against; a release with no new desktop build
          # gets a suffix and keeps the same desktop version.
          VERSION=$(sed -nE 's/^version: *//p' out/latest.yml 2>/dev/null | head -n1)
          [ -n "$VERSION" ] || VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then TAG="v${VERSION}-r${GITHUB_RUN_NUMBER}"; fi
          fi
          cat > notes.md <<EOF
          Soro X ${VERSION}: Windows, macOS, Android phone and tablet, iPhone and iPad.

          Download page and setup steps: see the repository README.

          - **Windows:** \`SoroX-Windows-Setup.exe\` (or the portable \`.exe\`). Unsigned: SmartScreen → More info → Run anyway.
          - **Mac:** \`SoroX-macOS-AppleSilicon.dmg\` (M1–M4) or \`SoroX-macOS-Intel.dmg\`. Not notarized: right-click the app → Open.
          - **Android phone (Soro X Mobile):** \`SoroX-Android.apk\`, the interview assistant on your own AI key: live answers, practice, prep; also opens Soro X on your computer.
          - **iPhone (Soro X Mobile):** \`SoroX-iPhone-unsigned.ipa\`, to be signed with your Apple ID (AltStore / Sideloadly) or built in Xcode.
          - **Android tablet:** \`SoroX-Tablet-Android.apk\`.
          - **iPad:** \`SoroX-Tablet-iPad-unsigned.ipa\`, to be signed with your Apple ID (AltStore / Sideloadly) or built in Xcode.

          Built from ${GITHUB_SHA} (desktop run ${{ steps.runs.outputs.desktop }}, tablet run ${{ steps.runs.outputs.tablet }}, mobile run ${{ steps.runs.outputs.mobile }}).

          This project is based on Natively, originally developed by Natively AI Private Limited.
          Natively Personal Use Source License v1.0: personal, educational, research and non-commercial use only.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Soro X ${VERSION}" --notes-file notes.md --latest
          echo "Published $TAG"
